name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  issues: write
  security-events: write

jobs:
  build-test-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_full: ${{ steps.meta.outputs.image_full }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="sha-${SHORT_SHA}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          {
            echo "image_tag=${TAG}"
            echo "image_full=${IMAGE}:${TAG}"
            echo "image_base=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build container image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.image_full }}" \
            --tag "${{ steps.meta.outputs.image_base }}:latest" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

      - name: Scan image for vulnerabilities (gate)
        # Fails the build on fixable HIGH/CRITICAL findings before the image
        # reaches the registry. Unfixed findings are excluded so the gate only
        # blocks on what a rebuild or dependency bump can resolve.
        id: trivy-gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_full }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-gate.txt
        env:
          # Detailed tables only: the per-target summary lists every
          # package.json in the image and drowns the findings.
          TRIVY_TABLE_MODE: detailed

      - name: Publish scan report to the step summary
        # Runs whether the gate passed or failed so the report is always visible.
        if: ${{ !cancelled() && steps.trivy-gate.outcome != 'skipped' }}
        run: |
          {
            echo "## Container image scan (Trivy)"
            echo
            echo "Image: \`${{ steps.meta.outputs.image_full }}\`"
            echo
            echo "Gate on fixable HIGH/CRITICAL vulnerabilities:" \
              "**${{ steps.trivy-gate.outcome == 'success' && 'PASSED' || 'FAILED' }}**"
            echo
            if [ -s trivy-gate.txt ]; then
              echo '```'
              cat trivy-gate.txt
              echo '```'
            else
              echo "No fixable HIGH/CRITICAL vulnerabilities found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-gate.txt

      # The two steps below only report; they never change the gate's outcome.
      # continue-on-error keeps a clean build green if code scanning is
      # unavailable on the repo (e.g. private repo without Advanced Security).
      - name: Generate SARIF report (all severities)
        if: ${{ !cancelled() && steps.trivy-gate.outcome != 'skipped' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_full }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          skip-setup-trivy: true
          cache: 'false'
        env:
          # The DB was fetched by the gate step and is reused as-is.
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Upload SARIF report to the Security tab
        if: ${{ !cancelled() && steps.trivy-gate.outcome != 'skipped' && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Push container image
        # The package visibility is automatically inherited from the repository:
        # a public repository produces a public package, a private repository
        # produces a private package.
        # App Service (which has no registry credentials) can pull the image as
        # long as the repository — and therefore the package — is public.
        run: |
          docker push "${{ steps.meta.outputs.image_full }}"
          docker push "${{ steps.meta.outputs.image_base }}:latest"

  deploy-dev:
    name: Deploy to dev
    needs: build-test-push
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build-test-push.outputs.image_tag }}
    # Inherit repo-level secrets so the called workflow can use GITHUB_TOKEN for OIDC.
    secrets: inherit
