name: Deploy / GCP

# Placeholder for the GCP-specific deployment reusable workflow (issue H10).
# It exposes the shared workflow_call contract so the deploy.yml router can
# reference it, and fails fast until the real implementation lands.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev | staging | prod)
        type: string
        required: true
      image_tag:
        description: Container image tag to deploy (e.g. sha-abc1234)
        type: string
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Not implemented
        run: |
          echo "::error::GCP deployment is not implemented yet — tracked in" \
            "issue H10 (deors/template-helloworld-express#10). Select another" \
            "cloud or wait for deploy-gcp.yml to be implemented."
          exit 1
