name: Deploy

# Cloud-agnostic deploy router. Resolves the target cloud and delegates the
# deployment to the matching cloud-specific reusable workflow. This file must
# not contain any cloud-provider deployment commands.
#
# Cloud resolution: the DEPLOY_TARGET_CLOUD variable, read in the scope of the
# target GitHub Environment. It is expected to be configured per environment
# by the orchestrator, alongside the other cloud parameters (accounts,
# subscriptions, principals, etc.). An environment-level value overrides a
# repository-level one, so each environment can target a different cloud
# (e.g. dev on azure, staging on aws, prod on gcp), while a repository-level
# value acts as the default for environments that don't override it.
#
# Note: `uses:` references to reusable workflows are resolved when the run
# starts, even for jobs skipped by their `if:` condition — so the three
# cloud workflow files must always exist.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev | staging | prod)
        type: string
        required: true
      image_tag:
        description: Container image tag to deploy (e.g. sha-abc1234)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      image_tag:
        description: Container image tag to deploy (e.g. sha-abc1234)
        type: string
        required: true

jobs:

  resolve-cloud:
    name: Resolve target cloud
    runs-on: ubuntu-latest
    # Bind to the target environment so vars.DEPLOY_TARGET_CLOUD resolves the
    # environment-scoped value (falling back to the repository-level one).
    environment: ${{ inputs.environment }}
    outputs:
      cloud: ${{ steps.resolve.outputs.cloud }}

    steps:
      - name: Resolve and validate target cloud
        id: resolve
        run: |
          CLOUD="${{ vars.DEPLOY_TARGET_CLOUD }}"

          if [ -z "${CLOUD}" ]; then
            echo "::error::DEPLOY_TARGET_CLOUD is not set for environment" \
              "'${{ inputs.environment }}'. Configure it as an environment" \
              "variable (or a repository-level default) with one of:" \
              "azure | aws | gcp."
            exit 1
          fi

          case "${CLOUD}" in
            azure|aws|gcp)
              echo "Target cloud for '${{ inputs.environment }}': ${CLOUD}"
              echo "cloud=${CLOUD}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Invalid DEPLOY_TARGET_CLOUD value '${CLOUD}' for" \
                "environment '${{ inputs.environment }}'. Allowed values:" \
                "azure | aws | gcp."
              exit 1
              ;;
          esac

  deploy-azure:
    name: Deploy on Azure
    needs: resolve-cloud
    if: needs.resolve-cloud.outputs.cloud == 'azure'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-azure.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

  deploy-aws:
    name: Deploy on AWS
    needs: resolve-cloud
    if: needs.resolve-cloud.outputs.cloud == 'aws'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

  deploy-gcp:
    name: Deploy on GCP
    needs: resolve-cloud
    if: needs.resolve-cloud.outputs.cloud == 'gcp'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-gcp.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
