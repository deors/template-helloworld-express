name: Deploy

# Cloud-agnostic deploy router. Resolves the target cloud and delegates the
# deployment to the matching cloud-specific reusable workflow. This file must
# not contain any cloud-provider deployment commands.
#
# Cloud resolution precedence:
#   1. workflow_dispatch input `cloud` (manual runs — always required)
#   2. workflow_call input `cloud` (when the caller provides it)
#   3. repository variable DEPLOY_TARGET_CLOUD (fallback for CI/release calls)
#
# Note: `uses:` references to reusable workflows are resolved when the run
# starts, even for jobs skipped by their `if:` condition — so the three
# cloud workflow files must always exist.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev | staging | prod)
        type: string
        required: true
      image_tag:
        description: Container image tag to deploy (e.g. sha-abc1234)
        type: string
        required: true
      cloud:
        description: >
          Target cloud (azure | aws | gcp). When omitted, resolved from the
          DEPLOY_TARGET_CLOUD repository variable.
        type: string
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      image_tag:
        description: Container image tag to deploy (e.g. sha-abc1234)
        type: string
        required: true
      cloud:
        description: Target cloud
        type: choice
        options: [azure, aws, gcp]
        required: true

jobs:

  resolve-cloud:
    name: Resolve target cloud
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.resolve.outputs.cloud }}

    steps:
      - name: Resolve and validate target cloud
        id: resolve
        run: |
          # Explicit input wins (workflow_dispatch makes it mandatory, so on
          # manual runs it is always present); repository variable is the
          # fallback for workflow_call invocations that omit it.
          CLOUD="${{ inputs.cloud }}"
          SOURCE="workflow input 'cloud'"
          if [ -z "${CLOUD}" ]; then
            CLOUD="${{ vars.DEPLOY_TARGET_CLOUD }}"
            SOURCE="repository variable DEPLOY_TARGET_CLOUD"
          fi

          if [ -z "${CLOUD}" ]; then
            echo "::error::No target cloud resolved." \
              "Pass the 'cloud' input (azure | aws | gcp) or set the" \
              "DEPLOY_TARGET_CLOUD repository variable."
            exit 1
          fi

          case "${CLOUD}" in
            azure|aws|gcp)
              echo "Target cloud: ${CLOUD} (from ${SOURCE})"
              echo "cloud=${CLOUD}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Invalid target cloud '${CLOUD}' (from ${SOURCE})." \
                "Allowed values: azure | aws | gcp."
              exit 1
              ;;
          esac

  deploy-azure:
    name: Deploy on Azure
    needs: resolve-cloud
    if: needs.resolve-cloud.outputs.cloud == 'azure'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-azure.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

  deploy-aws:
    name: Deploy on AWS
    needs: resolve-cloud
    if: needs.resolve-cloud.outputs.cloud == 'aws'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

  deploy-gcp:
    name: Deploy on GCP
    needs: resolve-cloud
    if: needs.resolve-cloud.outputs.cloud == 'gcp'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-gcp.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
