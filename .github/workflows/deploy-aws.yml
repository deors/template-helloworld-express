name: Deploy / AWS

# AWS-specific deployment reusable workflow (ECS Fargate). Invoked by the
# deploy.yml cloud router — do not call directly from CI or release workflows.
#
# Required GitHub Environment variables, configured by the orchestrator for
# the target environment (alongside the other cloud parameters):
#   AWS_ROLE_ARN     — IAM role assumed via OIDC (no long-lived keys)
#   AWS_REGION       — target AWS region
#   AWS_ECS_CLUSTER  — ECS cluster name
#   AWS_ECS_SERVICE  — ECS service name
#   AWS_APP_URL      — public base URL of the app; required for dev only,
#                      where the HTTP smoke test runs

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev | staging | prod)
        type: string
        required: true
      image_tag:
        description: Container image tag to deploy (e.g. sha-abc1234)
        type: string
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Preflight – validate required configuration
        # Fails fast, before login or any mutation, naming every missing item.
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
          AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
          AWS_APP_URL: ${{ vars.AWS_APP_URL }}
        run: |
          REQUIRED=(AWS_ROLE_ARN AWS_REGION AWS_ECS_CLUSTER AWS_ECS_SERVICE)
          # The public URL is only consumed by the dev HTTP smoke test;
          # staging/prod are validated via the control plane.
          if [ "${{ inputs.environment }}" = "dev" ]; then
            REQUIRED+=(AWS_APP_URL)
          fi

          MISSING=()
          for VAR in "${REQUIRED[@]}"; do
            [ -n "${!VAR}" ] || MISSING+=("${VAR}")
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing required variable(s) for environment" \
              "'${{ inputs.environment }}': ${MISSING[*]}. Configure them as" \
              "GitHub Environment variables for this environment."
            exit 1
          fi

          echo "Preflight OK: all required variables are set."

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Detect deployment controller
        # The infrastructure provisions services with different controllers
        # (rolling `ECS` vs blue/green `CODE_DEPLOY`); the deployment and
        # validation steps branch on this value.
        id: controller
        run: |
          CONTROLLER=$(aws ecs describe-services \
            --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
            --services "${{ vars.AWS_ECS_SERVICE }}" \
            --query 'services[0].deploymentController.type' --output text)
          echo "Deployment controller: ${CONTROLLER}"
          echo "type=${CONTROLLER}" >> "$GITHUB_OUTPUT"

      - name: Resolve image reference
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # $GITHUB_REPOSITORY is always owner/repo — reliable in reusable workflows
          # unlike github.event.repository.name which is empty under workflow_call.
          REPO=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${OWNER}/${REPO}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "app_name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Register task definition revision
        # A single-container task is assumed (this template's app). Image and
        # runtime env vars (APP_NAME / APP_ENV / IMAGE_TAG) land atomically in
        # the same revision, so the new container always starts with the
        # correct configuration — the ECS equivalent of the Azure flow where
        # app settings must be applied before the container image swap.
        id: taskdef
        run: |
          CURRENT_ARN=$(aws ecs describe-services \
            --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
            --services "${{ vars.AWS_ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current task definition: ${CURRENT_ARN}"

          aws ecs describe-task-definition \
            --task-definition "${CURRENT_ARN}" \
            --query taskDefinition > current-task-def.json

          jq \
            --arg IMAGE     "${{ steps.image.outputs.ref }}" \
            --arg APP_NAME  "${{ steps.image.outputs.app_name }}" \
            --arg APP_ENV   "${{ inputs.environment }}" \
            --arg IMAGE_TAG "${{ inputs.image_tag }}" \
            '
            .containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].environment =
                ((.containerDefinitions[0].environment // [])
                 | map(select(.name | IN("APP_NAME", "APP_ENV", "IMAGE_TAG") | not))
                 + [{name: "APP_NAME",  value: $APP_NAME},
                    {name: "APP_ENV",   value: $APP_ENV},
                    {name: "IMAGE_TAG", value: $IMAGE_TAG}])
            # Strip read-only fields the register API rejects.
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
            ' current-task-def.json > new-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task definition: ${NEW_ARN}"
          echo "arn=${NEW_ARN}" >> "$GITHUB_OUTPUT"

      - name: Update ECS service (rolling)
        if: steps.controller.outputs.type == 'ECS'
        run: |
          aws ecs update-service \
            --cluster         "${{ vars.AWS_ECS_CLUSTER }}" \
            --service         "${{ vars.AWS_ECS_SERVICE }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --query 'service.serviceName' --output text

      - name: Wait for service to reach steady state (rolling)
        # Polls the service until the new deployment settles (new tasks
        # running and healthy, old tasks drained). The waiter checks every
        # 15 s up to 40 times (~10 min) and fails the job on timeout.
        if: steps.controller.outputs.type == 'ECS'
        id: wait
        run: |
          aws ecs wait services-stable \
            --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
            --services "${{ vars.AWS_ECS_SERVICE }}"
          echo "Service reached steady state."

      - name: Create CodeDeploy deployment (blue/green)
        # CODE_DEPLOY-controlled services reject `ecs update-service`; the new
        # task definition ships as a CodeDeploy blue/green deployment instead.
        # The CodeDeploy resource names are derived from the provisioning
        # naming convention rather than configured — no extra variables.
        if: steps.controller.outputs.type == 'CODE_DEPLOY'
        id: bg_deploy
        run: |
          CD_APP="cd-${{ vars.AWS_ECS_SERVICE }}"
          CD_GROUP="${{ vars.AWS_ECS_SERVICE }}-dg"

          if ! aws deploy get-deployment-group \
              --application-name    "${CD_APP}" \
              --deployment-group-name "${CD_GROUP}" > /dev/null 2>&1; then
            echo "::error::CodeDeploy resources not found for service" \
              "'${{ vars.AWS_ECS_SERVICE }}': expected application '${CD_APP}'" \
              "with deployment group '${CD_GROUP}' (derived by naming" \
              "convention). Ensure the infrastructure provisions them under" \
              "these names."
            exit 1
          fi

          # Container name/port come from the revision registered above.
          CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' new-task-def.json)
          CONTAINER_PORT=$(jq -r '.containerDefinitions[0].portMappings[0].containerPort' new-task-def.json)

          jq -n \
            --arg     td "${{ steps.taskdef.outputs.arn }}" \
            --arg     cn "${CONTAINER_NAME}" \
            --argjson cp "${CONTAINER_PORT}" \
            '{revisionType: "AppSpecContent",
              appSpecContent: {content: ({
                version: "0.0",
                Resources: [{TargetService: {
                  Type: "AWS::ECS::Service",
                  Properties: {
                    TaskDefinition: $td,
                    LoadBalancerInfo: {ContainerName: $cn, ContainerPort: $cp}}}}]
              } | tojson)}}' > revision.json

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name      "${CD_APP}" \
            --deployment-group-name "${CD_GROUP}" \
            --revision file://revision.json \
            --query deploymentId --output text)

          echo "CodeDeploy deployment started: ${DEPLOYMENT_ID}"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for CodeDeploy deployment (blue/green)
        # Polls the deployment every 15 s (120 attempts ≈ 30-minute ceiling,
        # matching the CLI waiter) and logs status, the lifecycle stage in
        # progress, and the live ALB traffic split. The job log is the
        # reference progress view: the ECS console's task-set traffic column
        # lags until the task-set swap completes, and the two target groups
        # alternate blue/green roles between deployments. Reading the traffic
        # weights needs elasticloadbalancing:DescribeListeners on the deploy
        # role; without it the loop degrades to status/stage reporting.
        if: steps.controller.outputs.type == 'CODE_DEPLOY'
        id: bg_wait
        run: |
          DEPLOYMENT_ID="${{ steps.bg_deploy.outputs.deployment_id }}"
          echo "Waiting for deployment ${DEPLOYMENT_ID}" \
            "(blue/green traffic shifting takes several minutes)…"

          LISTENER=$(aws deploy get-deployment-group \
            --application-name      "cd-${{ vars.AWS_ECS_SERVICE }}" \
            --deployment-group-name "${{ vars.AWS_ECS_SERVICE }}-dg" \
            --query 'deploymentGroupInfo.loadBalancerInfo.targetGroupPairInfoList[0].prodTrafficRoute.listenerArns[0]' \
            --output text 2>/dev/null || true)
          WEIGHTS_OK=true

          for i in $(seq 1 120); do
            STATUS=$(aws deploy get-deployment \
              --deployment-id "${DEPLOYMENT_ID}" \
              --query 'deploymentInfo.status' --output text)

            STAGE=$(aws deploy get-deployment-target \
              --deployment-id "${DEPLOYMENT_ID}" \
              --target-id "${{ vars.AWS_ECS_CLUSTER }}:${{ vars.AWS_ECS_SERVICE }}" \
              --query 'deploymentTarget.ecsTarget.lifecycleEvents[?status==`InProgress`]|[0].lifecycleEventName' \
              --output text 2>/dev/null || true)
            [[ -z "${STAGE}" || "${STAGE}" == "None" ]] && STAGE="-"

            TRAFFIC=""
            if [[ -n "${LISTENER}" && "${WEIGHTS_OK}" == "true" ]]; then
              if RAW=$(aws elbv2 describe-listeners \
                  --listener-arns "${LISTENER}" \
                  --query 'Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups[].[TargetGroupArn, Weight]' \
                  --output text 2>/dev/null); then
                TRAFFIC=$(awk -F'\t' '{n=split($1,a,"/"); printf "%s=%s%% ", a[n-1], $2}' <<<"${RAW}")
              else
                WEIGHTS_OK=false
                echo "  (traffic weights unavailable — the deploy role may lack" \
                  "elasticloadbalancing:DescribeListeners; continuing with" \
                  "status/stage only)"
              fi
            fi

            echo "  [$(( (i - 1) * 15 ))s] status=${STATUS} stage=${STAGE} ${TRAFFIC}"

            case "${STATUS}" in
              Succeeded)
                echo "Deployment succeeded and traffic fully shifted."
                exit 0
                ;;
              Failed|Stopped)
                ERR=$(aws deploy get-deployment \
                  --deployment-id "${DEPLOYMENT_ID}" \
                  --query 'deploymentInfo.errorInformation' --output json)
                echo "::error::CodeDeploy deployment ${DEPLOYMENT_ID} ended as" \
                  "${STATUS}: ${ERR}"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::error::CodeDeploy deployment ${DEPLOYMENT_ID} did not complete" \
            "within 30 minutes (last status: ${STATUS}, stage: ${STAGE})."
          exit 1

      - name: Diagnose failed deployment
        # The waiter only reports a timeout; the reasons live in the service
        # events and the stopped tasks. Surface them in the job log so a
        # failed rollout (e.g. crash-looping tasks) is diagnosable without
        # console access.
        if: >-
          failure() && (steps.wait.outcome == 'failure' ||
          steps.bg_deploy.outcome == 'failure' ||
          steps.bg_wait.outcome == 'failure')
        run: |
          if [[ "${{ steps.controller.outputs.type }}" == "CODE_DEPLOY" ]]; then
            echo "::group::CodeDeploy deployments"
            CD_APP="cd-${{ vars.AWS_ECS_SERVICE }}"
            CD_GROUP="${{ vars.AWS_ECS_SERVICE }}-dg"
            for ID in $(aws deploy list-deployments \
                --application-name      "${CD_APP}" \
                --deployment-group-name "${CD_GROUP}" \
                --query 'deployments[0:3]' --output text 2>/dev/null); do
              aws deploy get-deployment --deployment-id "${ID}" \
                --query 'deploymentInfo.{id:deploymentId,status:status,error:errorInformation,createTime:createTime}' \
                --output json || true
            done
            echo "::endgroup::"
          fi

          echo "::group::Deployments"
          aws ecs describe-services \
            --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
            --services "${{ vars.AWS_ECS_SERVICE }}" \
            --query 'services[0].deployments[].{status:status,taskDef:taskDefinition,rollout:rolloutState,reason:rolloutStateReason,failedTasks:failedTasks,running:runningCount,desired:desiredCount}' \
            --output table
          echo "::endgroup::"

          echo "::group::Recent service events"
          aws ecs describe-services \
            --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
            --services "${{ vars.AWS_ECS_SERVICE }}" \
            --query 'services[0].events[0:10].message' --output table
          echo "::endgroup::"

          echo "::group::Stopped tasks (reasons and exit codes)"
          for TASK in $(aws ecs list-tasks \
              --cluster "${{ vars.AWS_ECS_CLUSTER }}" \
              --desired-status STOPPED \
              --query 'taskArns[0:5]' --output text); do
            aws ecs describe-tasks \
              --cluster "${{ vars.AWS_ECS_CLUSTER }}" --tasks "${TASK}" \
              --query 'tasks[0].{taskDef:taskDefinitionArn,stoppedReason:stoppedReason,stopCode:stopCode,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
              --output json || true
          done
          echo "::endgroup::"

          echo "::error::Deployment did not stabilize. Review the deployments," \
            "service events and stopped task reasons above (a crash-looping" \
            "container usually means the runtime configuration — e.g. PORT —" \
            "does not match the app's contract)."

      # -----------------------------------------------------------------------
      # Validation strategy differs by environment network exposure, mirroring
      # the Azure workflow:
      #
      #   dev     — public endpoint is open. Poll /health over HTTPS from the
      #             runner using AWS_APP_URL.
      #
      #   staging / prod — private-only ingress. The endpoint is unreachable
      #             from GitHub-hosted runners, so control-plane assertions are
      #             used instead:
      #               • service status is ACTIVE with all tasks running
      #               • the deployment settled: primary deployment rollout
      #                 COMPLETED (rolling) or primary task set STEADY_STATE
      #                 (blue/green — `deployments` is null under CODE_DEPLOY,
      #                 the state lives in `taskSets`)
      #               • the deployed task definition runs the expected image tag
      # -----------------------------------------------------------------------

      - name: Validate – HTTP smoke test (dev)
        if: inputs.environment == 'dev'
        run: |
          APP_URL="${{ vars.AWS_APP_URL }}"
          echo "Smoke-testing ${APP_URL}/health …"

          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "${APP_URL}/health" || echo "000")
            echo "  attempt ${i}: HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done

          echo "Health check timed out after 3 minutes."
          exit 1

      - name: Validate – control-plane assertions (staging / prod)
        if: inputs.environment != 'dev'
        run: |
          CONTROLLER="${{ steps.controller.outputs.type }}"

          echo "=== Service state ==="
          read -r STATUS RUNNING DESIRED TASKDEF <<<"$(aws ecs describe-services \
            --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
            --services "${{ vars.AWS_ECS_SERVICE }}" \
            --query 'services[0].[status, runningCount, desiredCount, taskDefinition]' \
            --output text)"
          echo "Status: ${STATUS} | Tasks: ${RUNNING}/${DESIRED} | Controller: ${CONTROLLER}"

          [[ "${STATUS}" == "ACTIVE" ]] \
            || { echo "::error::Service not ACTIVE (status=${STATUS})"; exit 1; }

          echo "=== Deployment state ==="
          if [[ "${CONTROLLER}" == "CODE_DEPLOY" ]]; then
            # Under CODE_DEPLOY `deployments` is null and, right after a
            # successful deployment, the service-level task counters span BOTH
            # task sets until the old (blue) set finishes draining — so all
            # assertions run against the PRIMARY task set. A short retry
            # absorbs control-plane propagation just after cutover.
            for i in 1 2 3 4 5 6; do
              read -r STABILITY TS_RUNNING TS_DESIRED TASKDEF <<<"$(aws ecs describe-services \
                --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
                --services "${{ vars.AWS_ECS_SERVICE }}" \
                --query 'services[0].taskSets[?status==`PRIMARY`]|[0].[stabilityStatus, runningCount, computedDesiredCount, taskDefinition]' \
                --output text)"
              echo "  attempt ${i}: primary task set ${STABILITY}, tasks ${TS_RUNNING}/${TS_DESIRED} (${TASKDEF})"
              if [[ "${STABILITY}" == "STEADY_STATE" && "${TS_RUNNING}" -gt 0 \
                    && "${TS_RUNNING}" -eq "${TS_DESIRED}" ]]; then
                break
              fi
              if [[ "${i}" -eq 6 ]]; then
                echo "::error::Primary task set did not settle" \
                  "(stabilityStatus=${STABILITY}, tasks ${TS_RUNNING}/${TS_DESIRED})."
                exit 1
              fi
              sleep 10
            done
          else
            # Service-level counters are only meaningful for the rolling
            # controller, where a completed deployment owns all tasks.
            [[ "${RUNNING}" -gt 0 && "${RUNNING}" -eq "${DESIRED}" ]] \
              || { echo "::error::Running tasks (${RUNNING}) do not match desired (${DESIRED})"; exit 1; }
            ROLLOUT=$(aws ecs describe-services \
              --cluster  "${{ vars.AWS_ECS_CLUSTER }}" \
              --services "${{ vars.AWS_ECS_SERVICE }}" \
              --query 'services[0].deployments[?status==`PRIMARY`]|[0].rolloutState' \
              --output text)
            echo "Primary deployment rollout: ${ROLLOUT}"
            [[ "${ROLLOUT}" == "COMPLETED" ]] \
              || { echo "::error::Primary deployment rollout not COMPLETED (state=${ROLLOUT})"; exit 1; }
          fi

          echo "=== Deployed image tag ==="
          IMG=$(aws ecs describe-task-definition \
            --task-definition "${TASKDEF}" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          echo "Image: ${IMG}"
          grep -q "${{ inputs.image_tag }}" <<<"${IMG}" \
            || { echo "::error::Deployed image (${IMG}) does not contain expected tag (${{ inputs.image_tag }})"; exit 1; }

          echo "Control-plane validation passed."

      - name: Confirm deployed version
        run: |
          echo "Deployed image   : ${{ steps.image.outputs.ref }}"
          echo "Task definition  : ${{ steps.taskdef.outputs.arn }}"
          echo "Cluster / service: ${{ vars.AWS_ECS_CLUSTER }} / ${{ vars.AWS_ECS_SERVICE }}"
